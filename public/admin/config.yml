# Sveltia CMS config. Every save is a commit to main, which redeploys the site.
# Sign in with GitHub (via the Cloudflare Worker below) or a fine-grained token (see README).
backend:
  name: github
  repo: MuslimFromPK/affanali.dev
  branch: main
  base_url: https://sveltia-cms-auth.muslimfrompk.workers.dev
  commit_messages:
    update: 'content: update {{collection}} “{{slug}}”'

site_url: https://affanali.dev
display_url: https://affanali.dev
media_folder: public/images
public_folder: /images

# Leave empty optional fields out of the file instead of writing `field: ''`.
output:
  omit_empty_optional_fields: true

collections:
  - name: pages
    label: Pages
    files:
      - name: home
        label: Homepage
        file: src/content/pages/home.md
        fields:
          - { name: title, label: Browser tab / SEO title, widget: string }
          - { name: description, label: SEO description, widget: text }
          - { name: knownAs, label: Name ↔ handle line, widget: string }
          - { name: body, label: Intro, widget: markdown }
          - { name: servicesHeading, label: '"What I do" heading', widget: string }
          - name: services
            label: What I do
            widget: list
            fields:
              - { name: title, label: Title, widget: string }
              - { name: text, label: Text, widget: text }

  - name: blog
    label: Blog
    label_singular: Post
    folder: src/content/blog
    path: '{{slug}}/index'
    extension: md
    format: frontmatter
    create: true
    # Images live next to each post's index.md.
    media_folder: ''
    public_folder: ''
    slug: '{{fields.title}}'
    sortable_fields: [pubDate, title]
    view_filters:
      - { label: Drafts, field: draft, pattern: true }
      - { label: Migrated, field: tags, pattern: migrated }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Summary (shown in lists & search results), widget: text }
      - { name: pubDate, label: Published, widget: datetime, time_format: false, date_format: 'YYYY-MM-DD', format: 'YYYY-MM-DD' }
      - { name: updatedDate, label: Updated, widget: datetime, time_format: false, date_format: 'YYYY-MM-DD', format: 'YYYY-MM-DD', required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: coverAlt, label: Cover alt text, widget: string, required: false }
      - { name: coverCaption, label: Cover caption / credit, widget: string, required: false }
      - { name: coverCaptionUrl, label: Caption link, widget: string, required: false }
      - { name: originalUrl, label: Originally published at (URL), widget: string, required: false }
      - { name: draft, label: Draft (hidden from the live site), widget: boolean, default: false, required: false }
      - { name: body, label: Post, widget: markdown }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Name, role & contact
        file: src/data/site.json
        fields:
          - { name: name, label: Name, widget: string }
          - { name: handle, label: Handle, widget: string }
          - { name: role, label: Role, widget: string }
          - { name: location, label: Location (keep to country only), widget: string }
          - { name: email, label: Contact email, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - { name: description, label: Default SEO description, widget: text }
